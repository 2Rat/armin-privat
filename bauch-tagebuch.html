<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<meta name="mobile-web-app-capable" content="yes">
<title>Bauch-Tagebuch</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#e2e0d9;--acc:#2f6b4f;--acc2:#e9f2ee;--warn:#b5471f;--warn2:#fbeee8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;background:var(--acc);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:5}
header h1{margin:0;font-size:18px;font-weight:600}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
main{padding:12px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:600;width:100%}
button.btn.sec{background:var(--acc2);color:var(--acc)}
button.btn.warn{background:var(--warn2);color:var(--warn)}
button.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff}
textarea{min-height:60px}
label{font-size:13px;color:var(--mut);display:block;margin:8px 0 4px}
.day{font-size:13px;color:var(--mut);margin:14px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.entry{display:flex;gap:10px}
.entry img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.entry .t{font-size:13px;color:var(--mut)}
.entry .body{flex:1;min-width:0}
.entry .comp{font-size:14px}
.sym{border-left:4px solid var(--warn)}
.pill{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:999px;padding:2px 8px;font-size:12px;margin:2px 2px 0 0}
.pill.b{background:var(--warn2);color:var(--warn)}
.mut{color:var(--mut);font-size:13px}
.hidden{display:none}
.fab{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:5}
.fab button{flex:1}
.scale{display:flex;gap:4px}
.scale button{flex:1;padding:10px 0;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:15px}
.scale button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.scale.b button.on{background:var(--warn);border-color:var(--warn)}
pre{white-space:pre-wrap;font:14px/1.4 inherit;margin:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.del{background:none;border:0;color:var(--mut);font-size:13px;padding:4px 0}
</style>
</head>
<body>
<header><h1>Bauch-Tagebuch <span style="font-size:11px;opacity:.6;font-weight:400">v10</span></h1><button id="btnSettings">⚙︎</button></header>
<main>

<section id="viewSettings" class="card hidden">
  <label>Anthropic API-Key (bleibt nur auf diesem Handy)</label>
  <input id="apiKey" type="password" placeholder="sk-ant-…">
  <label>Modell für Fotos</label>
  <select id="model">
    <option value="claude-haiku-5-5">Haiku 5.5 (günstig)</option>
    <option value="claude-sonnet-5-5">Sonnet 5.5 (genau)</option>
  </select>
  <div style="margin-top:10px" class="row">
    <button class="btn" id="saveSettings">Speichern</button>
  </div>
  <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
  <div class="row">
    <button class="btn sec" id="btnExport">Export JSON</button>
    <button class="btn sec" id="btnImport">Import JSON</button>
  </div>
  <input id="importFile" type="file" accept="application/json" class="hidden">
  <p class="mut" id="stats"></p>
</section>

<section id="viewNew" class="card hidden">
  <div class="row">
    <button class="btn" id="pickGallery">📷 Foto aus Galerie</button>
    <button class="btn sec" id="pickCamera">Kamera</button>
    <button class="btn sec" id="noPhoto">ohne Foto</button>
  </div>
  <input id="fileGallery" type="file" accept="image/*" class="hidden">
  <input id="fileCamera" type="file" accept="image/*" capture="environment" class="hidden">
  <div id="preview" class="hidden" style="margin-top:10px">
    <img id="previewImg" style="width:100%;border-radius:10px">
    <label>Zeitpunkt</label>
    <input id="mealTime" type="datetime-local">
    <label>Ergänzung (optional, z. B. „großer Filterkaffee mit Milch")</label>
    <input id="mealHint" type="text">
    <div style="margin-top:10px"><button class="btn" id="analyze">Auslesen</button></div>
  </div>
  <div id="editor" class="hidden" style="margin-top:10px">
    <label>Bestandteile – antippen zum Ändern, × entfernt</label>
    <div id="editPills"></div>
    <div class="row" style="margin-top:8px">
      <input id="addComp" type="text" placeholder="Bestandteil hinzufügen, z. B. Filterkaffee groß mit Milch">
      <button class="btn sec" id="addCompBtn" style="flex:0 0 auto;width:auto">+</button>
    </div>
    <p class="mut" id="editUnsicher"></p>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="saveMeal">Speichern</button>
      <button class="btn sec" id="cancelMeal">Abbrechen</button>
    </div>
  </div>
</section>

<section id="viewSym" class="card hidden">
  <label>Zeitpunkt</label>
  <div class="row">
    <input id="symTime" type="datetime-local">
    <button class="btn sec" id="symFromPhoto" style="flex:0 0 auto;width:auto;padding:10px 12px;font-size:14px">📷 aus Foto</button>
  </div>
  <input id="symPhoto" type="file" accept="image/*" class="hidden">
  <label>Stuhl (Bristol 1 = hart … 7 = flüssig, 0 = kein Stuhlgang)</label>
  <div class="scale b" id="bristol"></div>
  <label>Bauchschmerz (0 = keine … 3 = stark)</label>
  <div class="scale b" id="pain"></div>
  <label>Notiz</label>
  <textarea id="symNote" placeholder="z. B. Krämpfe nach dem Frühstück, Blähungen …"></textarea>
  <div style="margin-top:10px"><button class="btn" id="saveSym">Speichern</button></div>
</section>

<section id="viewAnalyse" class="card hidden">
  <p class="mut">Schickt alle Einträge (ohne Bilder) an die API und sucht nach Komponenten, die an Durchfall-Tagen 2–12 h vorher gehäuft auftreten. Sinnvoll ab ca. 3 Wochen Daten.</p>
  <label>Modell</label>
  <select id="modelAnalyse">
    <option value="claude-opus-5-5">Opus 5.5 (empfohlen für Mustersuche)</option>
    <option value="claude-sonnet-5-5">Sonnet 5.5</option>
    <option value="claude-haiku-5-5">Haiku 5.5 (günstig)</option>
  </select>
  <div style="margin-top:10px"><button class="btn" id="runAnalyse">Auswerten</button></div>
  <div id="analyseOut" class="card hidden" style="margin-top:10px"><pre id="analyseText"></pre></div>
</section>

<section id="viewList"></section>
</main>

<div class="fab">
  <button class="btn" id="tabNew">+ Mahlzeit</button>
  <button class="btn warn" id="tabSym">+ Symptom</button>
  <button class="btn sec" id="tabAnalyse">Auswertung</button>
</div>

<script>
const LS='bauchtagebuch.v1', LSK='bauchtagebuch.key', LSM='bauchtagebuch.model';
let entries=load();
const $=id=>document.getElementById(id);
const views=['viewSettings','viewNew','viewSym','viewAnalyse'];
function show(v){views.forEach(x=>$(x).classList.toggle('hidden',x!==v));window.scrollTo(0,0)}
function load(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
const LSB='bauchtagebuch.lastbackup';
function exportJson(auto){const b=new Blob([JSON.stringify(entries,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`bauch-tagebuch-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();localStorage.setItem(LSB,Date.now());if(auto){const t=document.createElement('div');t.textContent='Sicherung in Downloads gespeichert';t.style.cssText='position:fixed;top:60px;left:16px;right:16px;background:var(--acc);color:#fff;padding:10px;border-radius:10px;text-align:center;z-index:9';document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}}
function save(){localStorage.setItem(LS,JSON.stringify(entries));render();const lb=+localStorage.getItem(LSB)||0;if(entries.length>=3&&Date.now()-lb>7*864e5)try{exportJson(true)}catch(e){}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
function fmtLocal(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function fmtDay(iso){return new Date(iso).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

// Settings
$('apiKey').value=localStorage.getItem(LSK)||'';
if((localStorage.getItem(LSM)||'').indexOf('4-5')>=0||localStorage.getItem(LSM)==='claude-sonnet-5')localStorage.setItem(LSM,'claude-haiku-5-5');
$('model').value=localStorage.getItem(LSM)||'claude-haiku-5-5';
$('btnSettings').onclick=()=>{updateStats();show('viewSettings')};
$('saveSettings').onclick=()=>{localStorage.setItem(LSK,$('apiKey').value.trim());localStorage.setItem(LSM,$('model').value);show(null);alert('Gespeichert')};
function updateStats(){const m=entries.filter(e=>e.typ==='mahlzeit').length,s=entries.length-m;const lb=+localStorage.getItem(LSB);$('stats').textContent=`${m} Mahlzeiten, ${s} Symptom-Einträge, ca. ${Math.round(JSON.stringify(entries).length/1024)} kB gespeichert. Letzte Sicherung: ${lb?new Date(lb).toLocaleDateString('de-DE'):'noch keine'} (automatisch alle 7 Tage beim Speichern)`}
$('btnExport').onclick=()=>exportJson(false);
$('btnImport').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const arr=JSON.parse(t);if(!Array.isArray(arr))throw 0;const ids=new Set(entries.map(x=>x.id));let n=0;arr.forEach(x=>{if(!ids.has(x.id)){entries.push(x);n++}});save();alert(n+' Einträge importiert')}).catch(()=>alert('Datei nicht lesbar'));e.target.value=''};

// Tabs
$('tabNew').onclick=()=>{resetNew();$('analyze').parentElement.classList.remove('hidden');$('analyze').textContent='Auslesen';show('viewNew')};
$('tabSym').onclick=()=>{symEditId=null;$('symTime').value=fmtLocal(new Date());$('symNote').value='';setScale($('bristol'),0);setScale($('pain'),0);bristol=0;pain=0;show('viewSym')};
$('tabAnalyse').onclick=()=>show('viewAnalyse');

// Symptom scales
let bristol=0,pain=0,symEditId=null;
function buildScale(el,max,set){el.innerHTML='';for(let i=0;i<=max;i++){const b=document.createElement('button');b.textContent=i;b.onclick=()=>{set(i);setScale(el,i)};el.appendChild(b)}el.children[0].classList.add('on')}
function setScale(el,v){[...el.children].forEach((c,j)=>c.classList.toggle('on',j===v))}
function editSym(e){
  symEditId=e.id;bristol=e.bristol||0;pain=e.schmerz||0;
  $('symTime').value=fmtLocal(new Date(e.zeit));$('symNote').value=e.notiz||'';
  setScale($('bristol'),bristol);setScale($('pain'),pain);show('viewSym');
}
buildScale($('bristol'),7,v=>bristol=v);
buildScale($('pain'),3,v=>pain=v);
$('symFromPhoto').onclick=()=>$('symPhoto').click();
$('symPhoto').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const d=readExifDate(await f.arrayBuffer());
  if(d){$('symTime').value=fmtLocal(d)}else{$('symTime').value=fmtLocal(new Date(f.lastModified||Date.now()));alert('Keine Aufnahmezeit im Bild – Dateidatum übernommen, bitte prüfen')}
  e.target.value='';
};
$('saveSym').onclick=()=>{
  const t=$('symTime').value;if(!t)return alert('Zeit fehlt');
  const s={id:symEditId||uid(),typ:'symptom',zeit:new Date(t).toISOString(),bristol,schmerz:pain,notiz:$('symNote').value.trim()};
  const i=entries.findIndex(x=>x.id===s.id);if(i>=0)entries[i]=s;else entries.push(s);
  symEditId=null;save();show(null);
};

// Meal photo
let currentImg=null,currentThumb=null,draft=null; // draft = Eintrag in Bearbeitung
function resetNew(){currentImg=null;currentThumb=null;draft=null;$('preview').classList.add('hidden');$('previewImg').classList.remove('hidden');$('editor').classList.add('hidden');$('mealHint').value='';$('fileGallery').value='';$('fileCamera').value='';$('pickGallery').parentElement.classList.remove('hidden')}
function renderEditor(){
  const el=$('editPills');el.innerHTML='';
  (draft.komponenten||[]).forEach((k,i)=>{
    const s=document.createElement('span');s.className='pill';s.style.cssText='font-size:14px;padding:6px 10px;margin:3px';
    s.innerHTML=`<span class="nm">${esc(k.name)}${k.menge?' · '+esc(k.menge):''}</span> <b style="margin-left:6px;cursor:pointer">×</b>`;
    s.querySelector('.nm').onclick=()=>{const v=prompt('Bestandteil ändern (Name · Menge):',k.name+(k.menge?' · '+k.menge:''));if(v===null)return;const p=v.split('·');k.name=p[0].trim();k.menge=(p[1]||'').trim();renderEditor()};
    s.querySelector('b').onclick=()=>{draft.komponenten.splice(i,1);renderEditor()};
    el.appendChild(s);
  });
  $('editUnsicher').textContent=draft.unsicher?('KI unsicher bei: '+draft.unsicher):'';
  $('editor').classList.remove('hidden');
}
function addCompText(v){
  v=(v||'').trim();if(!v||!draft)return;
  v.split(/[,;]|\bund\b/).map(s=>s.trim()).filter(Boolean).forEach(s=>{const p=s.split('·');draft.komponenten.push({name:p[0].trim(),menge:(p[1]||'').trim(),kategorie:''})});
  $('addComp').value='';renderEditor();
}
$('addCompBtn').onclick=()=>addCompText($('addComp').value);
$('addComp').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('addCompBtn').click()}};
$('saveMeal').onclick=()=>{
  if(!draft)return;
  addCompText($('addComp').value);
  if(!draft.komponenten.length&&!confirm('Keine Bestandteile eingetragen – trotzdem speichern?'))return;
  if($('mealTime').value)draft.zeit=new Date($('mealTime').value).toISOString();
  draft.hinweis=$('mealHint').value.trim();
  const i=entries.findIndex(x=>x.id===draft.id);
  if(i>=0)entries[i]=draft;else entries.push(draft);
  save();resetNew();show(null);
};
$('cancelMeal').onclick=()=>{resetNew();show(null)};
function editEntry(e){
  draft=JSON.parse(JSON.stringify(e));
  $('pickGallery').parentElement.classList.add('hidden');
  $('previewImg').src=e.thumb?'data:image/jpeg;base64,'+e.thumb:'';$('previewImg').classList.toggle('hidden',!e.thumb);
  $('mealTime').value=fmtLocal(new Date(e.zeit));$('mealHint').value=e.hinweis||'';
  $('preview').classList.remove('hidden');$('analyze').parentElement.classList.add('hidden');
  renderEditor();show('viewNew');
}
$('pickGallery').onclick=()=>$('fileGallery').click();
$('pickCamera').onclick=()=>$('fileCamera').click();
$('noPhoto').onclick=()=>{
  draft={id:uid(),typ:'mahlzeit',zeit:new Date().toISOString(),komponenten:[],kaffee:null,unsicher:'',hinweis:'',thumb:null};
  $('pickGallery').parentElement.classList.add('hidden');
  $('previewImg').src='';$('previewImg').classList.add('hidden');
  $('mealTime').value=fmtLocal(new Date());
  $('preview').classList.remove('hidden');$('analyze').parentElement.classList.add('hidden');
  renderEditor();setTimeout(()=>$('addComp').focus(),100);
};
$('fileGallery').onchange=onFile;$('fileCamera').onchange=onFile;
async function onFile(e){
  const f=e.target.files[0];if(!f)return;
  const buf=await f.arrayBuffer();
  const exifDate=readExifDate(buf);
  $('mealTime').value=fmtLocal(exifDate||new Date(f.lastModified||Date.now()));
  const img=await loadImage(f);
  currentImg=toJpeg(img,1280,0.85);
  currentThumb=toJpeg(img,240,0.7);
  $('previewImg').src='data:image/jpeg;base64,'+currentImg;
  $('preview').classList.remove('hidden');
}
function loadImage(f){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)})}
function toJpeg(img,max,q){const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q).split(',')[1]}

// Minimal EXIF: DateTimeOriginal (0x9003)
function readExifDate(buf){
  try{
    const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;
    let off=2;
    while(off<v.byteLength){
      if(v.getUint8(off)!==0xFF)return null;
      const marker=v.getUint8(off+1);const len=v.getUint16(off+2);
      if(marker===0xE1 && v.getUint32(off+4)===0x45786966){ // "Exif"
        const t=off+10;const le=v.getUint16(t)===0x4949;
        const g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
        const ifd0=t+g32(t+4);
        let exifIfd=null;
        const n=g16(ifd0);
        for(let i=0;i<n;i++){const e=ifd0+2+i*12;if(g16(e)===0x8769){exifIfd=t+g32(e+8);break}}
        if(!exifIfd)return null;
        const m=g16(exifIfd);
        for(let i=0;i<m;i++){const e=exifIfd+2+i*12;if(g16(e)===0x9003){const p=t+g32(e+8);let s='';for(let k=0;k<19;k++)s+=String.fromCharCode(v.getUint8(p+k));const d=new Date(s.replace(/^(\d{4}):(\d{2}):(\d{2}) /,'$1-$2-$3T'));return isNaN(d)?null:d}}
        return null;
      }
      off+=2+len;
    }
  }catch(e){}
  return null;
}

// API
async function callApi(model,content,maxTokens,timeoutMs){
  const key=localStorage.getItem(LSK);if(!key)throw new Error('Kein API-Key – unter ⚙︎ eintragen');
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),timeoutMs||60000);
  let r;
  try{r=await fetch('https://api.anthropic.com/v1/messages',{signal:ac.signal,method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:maxTokens,messages:[{role:'user',content}]})})}
  catch(e){clearTimeout(to);throw new Error(e.name==='AbortError'?'Zeitüberschreitung – keine Antwort von der API':'Netzwerkfehler: '+e.message)}
  clearTimeout(to);
  if(!r.ok){const t=await r.text();const err=new Error('API '+r.status+': '+t.slice(0,300));err.status=r.status;throw err}
  const j=await r.json();return (j.content||[]).map(c=>c.text||'').join('');
}
async function callApiStream(model,content,maxTokens,onText,timeoutMs){
  const key=localStorage.getItem(LSK);if(!key)throw new Error('Kein API-Key – unter ⚙︎ eintragen');
  const ac=new AbortController();let to=setTimeout(()=>ac.abort(),timeoutMs||60000);
  let r;
  try{r=await fetch('https://api.anthropic.com/v1/messages',{signal:ac.signal,method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:maxTokens,stream:true,messages:[{role:'user',content}]})})}
  catch(e){clearTimeout(to);throw new Error(e.name==='AbortError'?'Zeitüberschreitung – keine Antwort von der API':'Netzwerkfehler: '+e.message)}
  if(!r.ok){clearTimeout(to);const t=await r.text();const err=new Error('API '+r.status+': '+t.slice(0,300));err.status=r.status;throw err}
  const rd=r.body.getReader();const dec=new TextDecoder();let buf='',out='',raw='',stop='';
  while(true){
    const {value,done}=await rd.read();if(done)break;
    clearTimeout(to);to=setTimeout(()=>ac.abort(),30000); // 30 s ohne neue Daten = Abbruch
    const chunk=dec.decode(value,{stream:true});buf+=chunk;if(raw.length<4000)raw+=chunk;
    let i;while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith('data:'))continue;
      try{const ev=JSON.parse(line.slice(5));
        if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.text){out+=ev.delta.text;onText(out)}
        if(ev.type==='message_delta'&&ev.delta&&ev.delta.stop_reason)stop=ev.delta.stop_reason;
        if(ev.type==='error')throw new Error('API: '+(ev.error&&ev.error.message||'Fehler'))
      }catch(e){if(e.message.startsWith('API'))throw e}
    }
  }
  clearTimeout(to);
  if(!out.trim()){localStorage.setItem('bauchtagebuch.lastraw',raw);throw new Error('Leere Antwort (stop_reason: '+(stop||'unbekannt')+'). Rohdaten:\n'+raw.slice(0,1500))}
  return out;
}

Antworte NUR mit JSON in genau dieser Form:
{"komponenten":[{"name":"Filterkaffee","menge":"große Tasse ca. 300 ml","kategorie":"Getränk"}],"kaffee":{"art":"Filterkaffee|Espresso|Cappuccino|kein","groesse":"klein|mittel|groß","milch":"ja|nein|unklar"},"unsicher":"kurz, was nicht erkennbar war"}`;

    const prompt=`Du bist Gastroenterologe und wertest ein Ernährungs-Symptom-Tagebuch aus. Die Person hat seit 20 Jahren morgendliche Durchfälle in Schüben kurz nach dem Frühstück, mit Krämpfen danach; Laktose, Fruktose, Sorbit, Gluten, Galle, Pankreas und Zöliakie sind abgeklärt. Bristol 6–7 = Durchfall, 1–2 = hart, 0 = kein Stuhlgang. Schmerz 0–3.

Gehe so vor und gliedere die Antwort mit diesen Überschriften:
1. DATENBASIS: Zeitraum, Anzahl Tage, Tage mit Durchfall (Bristol ≥6), Tage ohne, Mahlzeiten pro Tag. Benenne Lücken (Tage ohne Symptom-Eintrag, Tage ohne Mahlzeiten).
2. TAGESMUSTER: Uhrzeit des ersten Durchfalls, Abstand zur letzten Mahlzeit davor, Abstand zur Mahlzeit des Vorabends. Gibt es einen Zusammenhang mit spätem Essen oder Alkohol am Vorabend?

4. ENTLASTETE KOMPONENTEN: was oft vorkommt und trotzdem selten Beschwerden folgt.
5. HYPOTHESEN: maximal drei, mit dem konkreten Beleg aus den Daten. Sag ehrlich, wenn die Datenbasis für eine Aussage zu klein ist.
6. NÄCHSTER TEST: eine einzige Änderung für die nächste Woche, konkret formuliert, plus was im Tagebuch zusätzlich erfasst werden sollte.

Keine Diagnose, keine allgemeinen Ernährungstipps. Deutsch, präzise, Zahlen statt Adjektive.

// List
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const list=$('viewList');list.innerHTML='';
  if(!entries.length){list.innerHTML='<p class="mut" style="text-align:center;margin-top:40px">Noch keine Einträge. Erst unter ⚙︎ den API-Key eintragen, dann „+ Mahlzeit".</p>';return}
  const sorted=entries.slice().sort((a,b)=>b.zeit.localeCompare(a.zeit));
  let day='';
  sorted.forEach(e=>{
    const d=fmtDay(e.zeit);if(d!==day){day=d;const h=document.createElement('div');h.className='day';h.textContent=d;list.appendChild(h)}
    const c=document.createElement('div');c.className='card entry'+(e.typ==='symptom'?' sym':'');
    if(e.typ==='mahlzeit'){
      c.innerHTML=`${e.thumb?`<img src="data:image/jpeg;base64,${e.thumb}">`:''}<div class="body"><div class="t">${fmtTime(e.zeit)} · Mahlzeit</div><div class="comp">${(e.komponenten||[]).map(k=>`<span class="pill">${esc(k.name)}</span>`).join('')}</div>${e.hinweis?`<div class="mut">${esc(e.hinweis)}</div>`:''}<button class="del edit" style="margin-right:14px;color:var(--acc)">bearbeiten</button><button class="del rm">löschen</button></div>`;
      c.querySelector('.edit').onclick=()=>editEntry(e);
    }else{
      c.innerHTML=`<div class="body"><div class="t">${fmtTime(e.zeit)} · Symptom</div><div><span class="pill b">Stuhl ${e.bristol===0?'–':'Bristol '+e.bristol}</span><span class="pill b">Schmerz ${e.schmerz}</span></div>${e.notiz?`<div class="mut">${esc(e.notiz)}</div>`:''}<button class="del edit" style="margin-right:14px;color:var(--acc)">bearbeiten</button><button class="del rm">löschen</button></div>`;
      c.querySelector('.edit').onclick=()=>editSym(e);
    }
    c.querySelector('.rm').onclick=()=>{if(confirm('Eintrag löschen?')){entries=entries.filter(x=>x.id!==e.id);save()}};
    list.appendChild(c);
  });
}
render();
